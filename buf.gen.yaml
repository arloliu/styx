version: v2
plugins:
  - local: protoc-gen-go
    out: .
    opt: module=github.com/arloliu/styx
  - local: bin/protoc-gen-go-styx
    out: .
    opt: module=github.com/arloliu/styx
  - local: ["go", "tool", "-modfile=.buf.go.mod", "protoc-gen-go-vtproto"]
    out: .
    opt:
      - module=github.com/arloliu/styx
      - features=marshal+unmarshal+size
