syntax = "proto3";
package styx.codec.testpb;
option go_package = "github.com/arloliu/styx/codec/internal/testpb";

// Everything is a test-only message exercising every field kind the codec's
// vtprotobuf fast path must round-trip: scalars, bytes, repeated, map, oneof,
// and a nested message. It is generated by the same buf run as the repo's real
// messages, so it gains MarshalVT/UnmarshalVT and drives the cross-decode
// matrix and the codec dispatch benchmarks.
message Everything {
  int32 i32 = 1;
  int64 i64 = 2;
  uint32 u32 = 3;
  uint64 u64 = 4;
  bool flag = 5;
  string text = 6;
  bytes payload = 7;
  double real = 8;

  repeated int32 numbers = 9;
  repeated string tags = 10;

  map<string, int32> counts = 11;
  map<string, Nested> nested_by_key = 12;

  Nested nested = 13;

  oneof choice {
    int32 choice_int = 14;
    string choice_text = 15;
    Nested choice_nested = 16;
  }
}

// Nested is embedded and repeated inside Everything to exercise message-typed
// fields, map values, and oneof arms.
message Nested {
  string name = 1;
  int64 value = 2;
}
