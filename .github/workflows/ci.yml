name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .linter.go.sum
            .buf.go.sum

      # The protoc-gen-go-styx generator tests exec protoc directly; the
      # hosted runner does not ship it. Pinned to the version the tests
      # are developed against.
      - name: Install protoc
        env:
          PROTOC_VERSION: "30.2"
        run: |
          curl -sSLo /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local 'bin/protoc' 'include/*'
          protoc --version

      # The crash-window tests compile only under the failpoint build tag, so
      # nothing in the default suite covers them. Run them as their own step so
      # a failure names the tagged suite instead of being read as an ordinary
      # test failure. make ci runs the same target; the repeat is a test-cache
      # hit, not a second execution.
      - name: Run failpoint-gated crash-window tests
        env:
          GOFLAGS: -p=1
        run: make test-failpoint

      - name: Run make ci (lint, vet, test, failpoint tests, allocation gates)
        # -p=1 serializes test packages. The hosted runner has few CPUs and
        # the race-enabled suites carry ~1s liveness deadlines; packages
        # running in parallel starve each other and flake timing-sensitive
        # tests (observed: three different tests across three runs). Local
        # runs keep default parallelism.
        env:
          GOFLAGS: -p=1
        run: make ci
